# Machine-readable list of the sources in index.md, read by the ingestion pipeline.
# index.md stays the human-readable list; tests/test_manifest.py checks the two agree.
#
# Fields:
#   id         two-digit number, the prefix of `file`
#   file       PDF name under sources/docs/ (gitignored)
#   title      shown to users when a chunk is cited
#   url        the page the citation links to
#   type       assessment | annual_report | data | paper | consensus | method | taxonomy | energy
#   published  year of the document as ingested (capture year for snapshots)
#   snapshot   true for web pages captured as PDF; these need `captured` and re-capturing
#   captured   capture date, snapshots only
#   licence    open | cc-by | non-commercial | gov | restricted | unverified
#              restricted: copyright with no reuse licence (at most short extracts with credit)
#              unverified: no terms found in the PDF or on the publisher's site
#   ingest     false keeps a listed source out of the vector index

