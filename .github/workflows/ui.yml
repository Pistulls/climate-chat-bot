name: UI

# Audits, tests and builds every change to the Solid UI. On main, also syncs the build to
# the UI bucket and invalidates index.html in CloudFront (Project/Plans/04.UI.md, Deploy).
on:
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  workflow_dispatch: {}

# Least privilege for GITHUB_TOKEN; id-token lets the deploy steps request the OIDC token.
permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 12.14.0 # match ui/package.json's packageManager
  # The real site key on main; Cloudflare's always-pass test key where the variable isn't
  # available (e.g. pull requests from forks). The deploy refuses to ship the test key.
  VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
  TEST_SITE_KEY: 1x00000000000000000000AA

jobs:
  ui:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'push' && 'ui-prod' || format('ui-{0}', github.ref) }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm from npm, pinned (one of pnpm.io's documented installs), so no extra action.
      - name: Install pnpm
        run: npm install -g "pnpm@${PNPM_VERSION}"

      # The lockfile must match package.json exactly. pnpm-workspace.yaml applies the
      # 5-day release age and trust policy, and pnpm 12 fails on any unreviewed
      # install script.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on any known vulnerability, in direct or indirect packages.
      - name: Audit
        run: pnpm audit

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # --- Deploy: pushes to main only ---

      - name: Refuse the test site key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ "$VITE_TURNSTILE_SITE_KEY" = "$TEST_SITE_KEY" ]; then
            echo "TURNSTILE_SITE_KEY isn't set: the build has the test key." >&2
            exit 1
          fi

      # Public repo, public logs: the role ARN is a secret (so masked), and the account ID
      # is masked wherever it appears.
      - name: AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
          mask-aws-account-id: true

      - name: Find the bucket and distribution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=climate-chat-prod-ui-${account}" >> "$GITHUB_ENV"
          distribution=$(aws cloudfront list-distributions --output text \
            --query "DistributionList.Items[?contains(Aliases.Items, 'climate-chat.${DOMAIN_NAME}')].Id | [0]")
          test -n "$distribution" && test "$distribution" != "None"
          echo "DISTRIBUTION_ID=${distribution}" >> "$GITHUB_ENV"

      # Order matters: new hashed assets first, then the index.html that points at them,
      # then remove what the new build no longer has. A visitor mid-load never sees an
      # index.html whose assets are missing.
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync dist/assets "s3://${BUCKET}/assets" --no-progress \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" --no-progress \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          aws s3 sync dist/assets "s3://${BUCKET}/assets" --no-progress --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://${BUCKET}" --no-progress --delete \
            --exclude "assets/*" --exclude "index.html" --cache-control "public, max-age=300"

      - name: Invalidate index.html
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/" "/index.html" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      # The live page must point at this build's script.
      - name: Check the live page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          script=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html)
          curl -sf "https://climate-chat.${DOMAIN_NAME}/" | grep -q "$script"
          echo "Live page serves ${script}"
